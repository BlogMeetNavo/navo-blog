backend:
  name: git-gateway
  branch: main

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: posts
    label: Blog Posts
    folder: content/posts
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish Date, name: date, widget: datetime }
      - { label: Author, name: author, widget: string, default: Belinda }
      - { label: Description, name: description, widget: text }
      - { label: Featured Image, name: image, widget: image, required: false }
      - { label: Body, name: body, widget: markdown }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: "CTA Type", name: cta_type, widget: select, options: ["check-in", "video", "checklist", "app", "none"], default: "check-in" }
      - { label: "CTA Link", name: cta_link, widget: string, required: false }
